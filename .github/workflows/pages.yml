name: fixtures-pages

on:
  push:
    branches: [main]
    paths:
      - 'fixtures/prospects/**'
      - '.github/workflows/pages.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @v-copilot/fixtures...
      - run: pnpm --filter @v-copilot/fixtures test
      - run: pnpm --filter @v-copilot/fixtures build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fixtures/prospects/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
